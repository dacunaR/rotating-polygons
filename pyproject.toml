[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotating-polygons"
version = "0.1.0"
description = "Differentiable simulation and shape optimization of rotating polygon metamaterials"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.8.0,<0.9",
    "jaxopt==0.8.3",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9"]
video = ["matplotlib>=3.9", "pillow>=10"]
nlopt = ["nlopt>=2.11,<3"]
notebook = ["matplotlib>=3.9", "jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "build>=1", "ruff>=0.8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
